<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      
      <!--car-->
      <a-box position="0 1 -5" width="5" height="3" depth="3" wireframe="true">

      <a-box position="0 0 0" width="4" height="0.8" depth="2"" color="#8B4513"></a-box>
      <a-box position="-1 0.85 0" width="1.8" height="1.3" depth="1.8"" color=#A0522D"></a-box>
      <a-box position="-1.91 0.9 0" width="0.05" height="0.6" depth="1.4" color="#ADD8E6"></a-box>
      <a-box position="-1 0.9 0.91" width="1" height="0.6" depth="0.05" color="#ADD8E6"></a-box>
      <a-box position="-1 0.9 -0.91" width="1" height="0.6" depth="0.05" color="#ADD8E6"></a-box>

      <a-cylinder position="-1.55 0.25 1.15" rotation="90 0 0" radius="0.30" height="0.3" color="#343434"></a-cylinder>
      <a-cylinder position="-1.55 0.25 -1.15" rotation="90 0 0" radius="0.30" height="0.3" color="#343434"></a-cylinder>
      <a-cylinder position="1.3 0.25 1.15" rotation="90 0 0" radius="0.30" height="0.3" color="#343434"></a-cylinder>
      <a-cylinder position="1.3 0.25 -1.15" rotation="90 0 0" radius="0.30" height="0.3" color="#343434"></a-cylinder>
      

       <!--road-->
      <a-plane position="0 0 -10" rotation="-90 0 0" width="8" height="30" color="#A9A9A9"></a-plane>
      <a-box position="0 0.02 3" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>
      <a-box position="0 0.02 -2" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>
      <a-box position="0 0.02 -7" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>
      <a-box position="0 0.02 -12" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>
      <a-box position="0 0.02 -17" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>
      <a-box position="0 0.02 -22" width="0.15" height="0.02" depth = "3" color="#FFFF00"></a-box>

       <!--grass--> 
       <a-plane position="-9 -0.01 -10" rotation="-90 0 0" width="10" height="30" color="#06402B"></a-plane>
       <a-plane position="9 -0.01 -10" rotation="-90 0 0" width="10" height="30" color="#06402B"></a-plane>

        <!--grass--> 
      <a-sky color="#ECECEC"></a-sky>


      <a-camera position="0 2 4"></a-camera>


        <a-sky  src="sky1 copy.jpeg "></a-sky>
    </a-scene>
  </body>
</html>
